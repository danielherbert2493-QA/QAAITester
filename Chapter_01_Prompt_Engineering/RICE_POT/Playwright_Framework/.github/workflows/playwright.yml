name: Playwright

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      SEARCH_TERM: ${{ secrets.SEARCH_TERM }}
      NO_RESULT_TERM: ${{ secrets.NO_RESULT_TERM }}
      TEST_PRODUCT_NAME: ${{ secrets.TEST_PRODUCT_NAME }}
      TEST_ID_ATTRIBUTE: ${{ secrets.TEST_ID_ATTRIBUTE }}
      ALLOW_ORDER_PLACEMENT: 'false'
      SANDBOX_PAYMENT_METHOD: ${{ secrets.SANDBOX_PAYMENT_METHOD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test --shard=${{ matrix.shard }}/2
      - run: npx allure generate allure-results --clean -o allure-report
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.shard }}
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 14
